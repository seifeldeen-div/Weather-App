<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- main style template -->
    <link rel="stylesheet" href="../Css/weather.css">
    <!-- fontAwesome lib -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google font8 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alata&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=League+Spartan:wght@100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="heading">
            <h2>Miami</h2>
            <p>US</p>
        </div>
        <div class="witherCard cardStyle">
            <div class="icon">
                <i class="fa-regular fa-cloud"></i>
            </div>
            <div class="temp">
                <p><span>19</span><sup>o</sup></p>
            </div>
            <div class="content">
                <p>Partly Cloudy</p>
                <p>Feels like <span>17</span>°C</p>
            </div>
            <div class="highLowTemp">
                <p>High: <span>19</span><sup>o</sup></p>
                <p>Low: <span>15</span><sup>o</sup></p>
            </div>
        </div>
        <div class="detailsCard cardStyle">
            <div class="heading">
                <h3>Today's Details</h3>
            </div>
            <div class="content">
                <div class="part">
                    <div>
                        <span><i class="fa-solid fa-droplet fa-bounce"></i></span>
                        <span>Humidity</span>
                    </div>
                    <div>
                        <p><span>20</span>%</p>
                    </div>
                </div>
                <div class="part">
                    <div>
                        <span><i class="fa-solid fa-wind fa-shake"></i></span>
                        <span>Wind</span>
                    </div>
                    <div>
                        <p><span>12</span> mph</p>
                    </div>
                </div>
                <div class="part">
                    <div>
                        <span><i class="fa-solid fa-eye fa-fade"></i></span>
                        <span>Visibility</span>
                    </div>
                    <div>
                        <p><span>10</span> mi</p>
                    </div>
                </div>
                <div class="part">
                    <div>
                        <span><i class="fa-solid fa-gauge-simple fa-spin"></i></span>
                        <span>Pressure</span>
                    </div>
                    <div>
                        <p><span>1013</span> mb</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="nav">
        <a href="#"><i class="fa-solid fa-plus fa-beat"></i></a>
    </div>

    <!-- main JS template -->
    <script src="Js/main.js"></script>
</body>

</html>
