<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherPro</title>
    <!-- main style template -->
    <link rel="stylesheet" href="../Css/search.css">
    <!-- fontAwesome lib -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google font8 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Alata&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=League+Spartan:wght@100..900&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- icon  -->
    <link rel="icon" type="png" href="../assets/images/icon.png">
</head>

<body>
    <div class="container">
        <div class="heading">
            <a href="weather.html">
                <i class="fa-solid fa-arrow-left-long fa-fade"></i>
            </a>
            <h2>Pick Location</h2>
        </div>
        <div class="inputSearch">
            <input id="inputSearchField" type="search" placeholder="Search for a city...">
        </div>
        <div class="sugges">
            <div class="heading">
                <p>Recent Locations</p>
            </div>
            <div class="suges-table">
                <div class="card">
                    <span>
                        <i class="fa-solid fa-location-dot"></i>
                    </span>
                    <div class="card-content">
                        <div>
                            <p>Alexandria</p>
                            <p>Egypt</p>
                        </div>
                        <div class="temp">
                            <p id="tempCard1">19<sup>o</sup></p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <span>
                        <i class="fa-solid fa-location-dot"></i>
                    </span>
                    <div class="card-content">
                        <div>
                            <p>Giza</p>
                            <p>Egypt</p>
                        </div>
                        <div class="temp">
                            <p id="tempCard2">19<sup>o</sup></p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <span>
                        <i class="fa-solid fa-location-dot"></i>
                    </span>
                    <div class="card-content">
                        <div>
                            <p>Tanta</p>
                            <p>Egypt</p>
                        </div>
                        <div class="temp">
                            <p id="tempCard3">19<sup>o</sup></p>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <span>
                        <i class="fa-solid fa-location-dot"></i>
                    </span>
                    <div class="card-content">
                        <div>
                            <p>Sharm El Sheikh</p>
                            <p>Egypt</p>
                        </div>
                        <div class="temp">
                            <p id="tempCard4">19<sup>o</sup></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="homepage">
            <a href="../index.html">Home Page</a>
        </div>
    </div>

    <!-- searchSign -->
    <div id="searchSign" class="searchSign">
        <a href="../pages/weather.html">
            <i class="fa-solid fa-arrow-right-long fa-shake"></i>
        </a>
    </div>

    <!-- errorCity -->
    <div class="errorCity">
        <span>Enter Valid City</span>
    </div>

    <!-- WebPhone -->
    <div class="WebPhone hidden">
        <h1>WEB APP PHONE</h1>
        <h2>PLEASE USE YOUR PHONE TO SHOW CONTENT</h2>
    </div>

    <!-- main scrit temp -->
    <script src="../Js/main.js"></script>
</body>

</html>
