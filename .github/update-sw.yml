name: update-sw-cache

on:
  push:
    branches:
      - main

jobs:
  update-sw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: inject-build-date
        run: |
          BUILD=$(date +"%Y%m%d%H%M%S")
          sed -i "s/__BUILD_DATE__/$BUILD/g" sw.js

      - name: commit-sw
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --cached --quiet || git commit -m "chore: bump sw cache version"
          git push